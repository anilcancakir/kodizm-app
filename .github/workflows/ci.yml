name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.6'
  SENTRY_ORG: kodizmai
  SENTRY_PROJECT: kodizm-ai-app

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for analyzer
        run: cp .env.example .env

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for asset bundle
        run: cp .env.example .env

      - name: Run tests
        run: flutter test

  # --------------------------------------------------------------------------
  # Deploy (master only, after analyze + test pass)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [analyze, test]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment: ${{ inputs.environment || 'development' }}
    concurrency:
      group: deploy-app-${{ inputs.environment || 'development' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write .env
        run: echo "${{ secrets.APP_ENV_FILE }}" > .env

      - name: Inject build metadata
        run: |
          echo "APP_BUILD_HASH=$(git rev-parse --short=7 HEAD)" >> .env
          echo "APP_BUILD_DATE=$(git log -1 --format=%cI HEAD)" >> .env

      - name: Build web (release)
        run: |
          SENTRY_RELEASE="app@${{ github.sha }}"
          flutter build web --release \
            --wasm \
            --base-href=/ \
            --source-maps \
            --no-web-resources-cdn \
            --no-tree-shake-icons \
            --dart-define=SENTRY_RELEASE=${SENTRY_RELEASE} \
            --dart-define=SENTRY_DIST=1
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Cache-bust static assets
        run: |
          BUILD_TS=$(date +%s)
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${BUILD_TS}|g" build/web/index.html

      - name: Upload source maps to Sentry
        run: |
          npx @sentry/cli@latest sourcemaps inject build/web/
          npx @sentry/cli@latest sourcemaps upload \
            --release="app@${{ github.sha }}" \
            --dist=1 \
            --url-prefix='~/' \
            build/web/
          npx @sentry/cli@latest releases set-commits \
            "app@${{ github.sha }}" --auto
          npx @sentry/cli@latest releases deploys \
            "app@${{ github.sha }}" new \
            -e ${{ inputs.environment || 'development' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5..."
            rsync -avz --delete \
              -e "ssh -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p ${{ secrets.SSH_PORT }}" \
              build/web/ \
              ${{ secrets.SSH_USER_APP }}@${{ secrets.SSH_HOST }}:/home/kodizm-ai/htdocs/ai.kodizm.com/ && exit 0
            echo "Attempt $attempt failed (exit $?), retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          echo "All 5 attempts failed"
          exit 1
