<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Multi-agent AI development platform — orchestrate your entire SDLC with intelligent agents.">

  <!-- Theme Color -->
  <meta name="theme-color" content="#334E68">
  <meta name="theme-color" content="#1A2332" media="(prefers-color-scheme: dark)">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kodizm">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai.kodizm.com/">
  <meta property="og:title" content="Kodizm - AI Dev Platform">
  <meta property="og:description" content="Multi-agent AI development platform — orchestrate your entire SDLC with intelligent agents.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Kodizm - AI Dev Platform">
  <meta name="twitter:description" content="Multi-agent AI development platform — orchestrate your entire SDLC with intelligent agents.">

  <title>Kodizm - AI Dev Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background: #1A2332;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1A2332;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash img {
      width: 160px;
      height: auto;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-512.png" alt="Kodizm">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
