name: Deploy Flutter App

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  FLUTTER_VERSION: '3.32.0'
  SENTRY_ORG: kodizmai
  SENTRY_PROJECT: kodizm-ai-app

jobs:
  # --------------------------------------------------------------------------
  # Web Build & Deploy
  # --------------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Download .env from server
        run: |
          scp -P ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER_APP }}@${{ secrets.SSH_HOST }}:/home/kodizm-ai/htdocs/ai.kodizm.com/.env \
            .env

      - name: Build web (release)
        run: |
          flutter build web --release \
            --base-href=/ \
            --source-maps
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload source maps to Sentry
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ inputs.environment || 'development' }}
          version: ${{ github.sha }}
          sourcemaps: build/web
          url_prefix: '~/'

      - name: Deploy to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            build/web/ \
            ${{ secrets.SSH_USER_APP }}@${{ secrets.SSH_HOST }}:/home/kodizm-ai/htdocs/ai.kodizm.com/

  # --------------------------------------------------------------------------
  # iOS Build & Deploy (disabled until App Store setup)
  # --------------------------------------------------------------------------
  ios:
    if: false
    name: iOS
    runs-on: macos-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS (release)
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload dSYM to Sentry
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ inputs.environment || 'development' }}
          version: ${{ github.sha }}

      - name: Upload dSYM files via sentry-cli
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }} \
            build/ios/archive/Runner.xcarchive/dSYMs/
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # TODO: Replace with TestFlight / App Store Connect upload
      - name: Deploy to TestFlight
        run: echo "Upload build/ios/ipa/*.ipa to TestFlight"

  # --------------------------------------------------------------------------
  # Android Build & Deploy (disabled until Play Store setup)
  # --------------------------------------------------------------------------
  android:
    if: false
    name: Android
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android (release)
        run: |
          flutter build appbundle --release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload ProGuard mappings to Sentry
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }} \
            build/app/intermediates/merged_native_libs/release/out/lib/
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Upload Dart debug symbols (obfuscation mapping)
      - name: Upload Dart debug symbols
        if: ${{ success() }}
        run: |
          sentry-cli debug-files upload \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }} \
            build/app/outputs/mapping/release/

      # TODO: Replace with Play Store upload
      - name: Deploy to Play Store
        run: echo "Upload build/app/outputs/bundle/release/*.aab to Play Store"

  # --------------------------------------------------------------------------
  # Sentry Release Finalization
  # --------------------------------------------------------------------------
  finalize:
    name: Finalize Sentry Release
    runs-on: ubuntu-latest
    needs: [web]
    if: needs.web.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Create Sentry release & set commits
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
        with:
          environment: ${{ inputs.environment || 'development' }}
          version: ${{ github.sha }}
          set_commits: auto
